name: Build and test
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Validate and package
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: smart-beacons
          path: artifacts/SmartBeacons-v*.zip
          if-no-files-found: error
